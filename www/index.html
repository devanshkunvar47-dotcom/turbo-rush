function tag(m,n){if(m.userData.tag)m.remove(m.userData.tag);const k=document.createElement('canvas');k.width=256;k.height=64;const x=k.getContext('2d');x.font='italic 800 34px Rubik,Arial';x.textAlign='center';x.lineWidth=7;x.strokeStyle='#000b';x.strokeText(n,128,44);x.fillStyle='#fff';x.fillText(n,128,44);
 const sp=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(k),transparent:true,fog:false}));sp.scale.set(8,2,1);sp.position.set(0,3.6,0);m.add(sp);m.userData.tag=sp}
function syncRem(){const ids=new Set(others().map(p=>p.peer));
 for(const p of others())if(!rem[p.peer]){const c=CARS[p.presence.car|0]||CARS[0],m=mkCar(c.c,c.neon,0,c.sx);world.add(m);rem[p.peer]={m,s:p.presence.s||0,d:p.presence.d||0,nm:null}}
 for(const p of others()){const r=rem[p.peer],n=p.presence.nm||'Player';if(r&&r.nm!==n){r.nm=n;tag(r.m,n)}}

 if(st!=='menu'){syncRem();for(const id in rem){const r=rem[id],p=mp.peers.find(q=>q.peer===id);if(!p||p.presence.s==null)continue;const k=Math.min(1,dt*10);r.s+=(p.presence.s-r.s)*k;r.d+=(p.presence.d-r.d)*k;place(r.m,r.s,r.d)}}
 sendT-=dt;if(sendT<=0&&st!=='menu'){sendT=.1;mp.room.presence({s:+P.s.toFixed(1),d:+P.d.toFixed(2),v:+P.v.toFixed(1)}).catch(()=>{})}}

  const r=await room.join(wid(name));mp={room,code:name,peers:[]};mp.room=r;r.onPeers(onPeersCh,()=>{$('ms').textContent='कनेक्शन टूट गया'});

const ord=n=>['','1st','2nd','3rd'][n]||n+'th';
function finish(){st='done';const win=rank<=3,rw=Math.round([1500,900,500,250,150,100][rank-1]*(1+S.lvl*.25));S.coins+=rw;if(win)S.lvl++;save();
 setTimeout(()=>overlay((win?'🏁 ':'')+ord(rank)+' पोज़िशन',`इनाम: 🪙${rw}`+(win?' · अगला लेवल खुल गया!':' · अगले लेवल के लिए टॉप 3 में आओ।')+' नई गाड़ी खरीदो और और तेज़ दौड़ो!',win?'NEXT RACE':'RETRY'),1400)}
function step(dt){
 tm+=dt;const D=CARS[S.sel],run=st==='run';
 if(st==='count'){ct-=dt;if(ct>0)$('cd').textContent=Math.ceil(ct);else{st='run';$('cd').textContent='GO!';goT=.8}}if(goT>0){goT-=dt;if(goT<=0)$('cd').textContent=''}
 const lvl=S.lvl,aiT=Math.min(56+lvl*4.5,118);
 boost=run&&(kN||tN)&&P.nit>.03?1:0;P.nit=Math.max(0,Math.min(1,P.nit+(boost?-.34:.07)*dt));
 if(run){const top=D.top*(boost?1.25:1);if(gas)P.v+=D.acc*(boost?1.8:1)*Math.max(0,1-P.v/(top*1.12))*dt;if(brk)P.v-=45*dt}else if(st==='done')P.v*=1-dt*.7;
 P.v=Math.max(0,P.v-(.5+P.v*P.v*.00015)*dt);
 const w=run?steer:0,ci=Math.min(N-1,P.s/DS|0);
 P.d+=(w*D.h*18/(1+P.v/30)*Math.min(1,P.v/10)+CV[ci]*P.v*P.v*.12)*dt;
 if(Math.abs(P.d)>8){P.d=Math.sign(P.d)*8;P.v*=1-dt*1.3;shake=Math.max(shake,.25)}
 P.s+=P.v*dt;P.hit-=dt;
 for(const a of ais){if(a.dead){a.v=0;place(a.m,a.s,a.d);continue}let t=aiT*a.k;const df=a.s-P.s;if(df<-150)t*=1.07;if(df>200)t*=.93;if(st==='count')t=0;
  a.v+=(t-a.v)*Math.min(1,dt*.7);a.s+=a.v*dt;
  for(const o of obs)if(!o.dead&&o.s>a.s&&o.s-a.s<45&&Math.abs(o.d-a.d)<3)a.lane=o.d>0?-6:6;
  if(Math.random()<dt*.12)a.lane=[-6,0,6][Math.random()*3|0];
  a.d+=(a.lane+Math.sin(tm*.6+a.ph)*1.2-a.d)*Math.min(1,dt*1.5);place(a.m,a.s,a.d)}
 if(run){
  for(const o of obs)if(!o.dead&&Math.abs(o.s-P.s)<2.8&&Math.abs(o.d-P.d)<2&&P.hit<=0){P.v*=.4;P.hit=.5;shake=1;o.dead=1;o.m.visible=false}
  for(const a of ais)if(!a.dead&&Math.abs(a.s-P.s)<4.6&&Math.abs(a.d-P.d)<2.1&&P.hit<=0){if(P.v-a.v>28){boom(a.s,a.d,0);destroy(a);P.v*=.88}else if(P.s<a.s)P.v=Math.min(P.v,a.v*.9);else a.v*=.8;P.d+=(P.d>=a.d?1:-1)*.8;P.hit=.4;shake=.6}
  rank=1+ais.filter(a=>a.s>P.s).length+(MPon()?others().filter(p=>(p.presence.s||0)>P.s).length:0);if(P.s>=FS)finish()}
}
function frame(t){const dt=Math.min(.05,(t-(frame.l||t))/1000);frame.l=t;
 if(st!=='menu'||world.children.length)step(dt);mpTick(dt);combat(dt);
 if(!drag){rot*=Math.exp(-dt*9);steer=rot/120}$('wg').style.transform=`rotate(${rot}deg)`;
 const p=place(pc,P.s,P.d);pc.rotation.y=p.t-steer*.05;if(pc.flame){pc.flame.visible=!!boost;pc.flame.scale.y=.8+Math.random()*.5}
 const fx=Math.sin(p.t),fz=Math.cos(p.t),tx=pc.position.x-fx*8.4,tz=pc.position.z-fz*8.4,ty=p.y+3.2;
 if(camInit){cam.position.set(tx,ty,tz);camInit=0}else cam.position.lerp(new T.Vector3(tx,ty,tz),1-Math.exp(-9*dt));
 shake=Math.max(0,shake-dt*2.2);cam.position.x+=(Math.random()-.5)*shake*.5;cam.position.y+=(Math.random()-.5)*shake*.5;
 cam.lookAt(pc.position.x+fx*14,p.y+1.3,pc.position.z+fz*14);
 const fov=60+P.v/114*16+boost*9;cam.fov+=(fov-cam.fov)*Math.min(1,dt*5);cam.updateProjectionMatrix();
 const pa=snp.geometry.attributes.position,a=pa.array,c=cam.position;
 for(let i=0;i<3600;i+=3){a[i+1]-=dt*.4;a[i]+=dt*5;if(a[i]-c.x>30)a[i]-=60;else if(a[i]-c.x<-30)a[i]+=60;if(a[i+2]-c.z>30)a[i+2]-=60;else if(a[i+2]-c.z<-30)a[i+2]+=60;if(a[i+1]<c.y-8)a[i+1]+=26;if(a[i+1]>c.y+18)a[i+1]-=26}
 pa.needsUpdate=true;far.position.x=c.x;far.position.z=c.z;
 $('kmh').textContent=Math.round(P.v*3.6);$('pos').textContent=ord(rank);$('pr').style.width=Math.min(100,P.s/FS*100)+'%';$('nf').style.height=P.nit*100+'%';
 R.render(sc,cam);requestAnimationFrame(frame)}
const wh=$('wheel');let a0=0;
const ang=e=>{const r=wh.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI};
wh.addEventListener('pointerdown',e=>{drag=1;wh.setPointerCapture(e.pointerId);a0=ang(e)-rot});
wh.addEventListener('pointermove',e=>{if(!drag)return;let d=ang(e)-a0;while(d>180)d-=360;while(d<-180)d+=360;rot=Math.max(-120,Math.min(120,d));steer=rot/120});
['pointerup','pointercancel'].forEach(n=>wh.addEventListener(n,()=>drag=0));
function hold(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);fn(1)});['pointerup','pointercancel'].forEach(n=>b.addEventListener(n,()=>fn(0)))}

const K={};function kk(e,v){K[e.code]=v;
 if(/ArrowUp|KeyW/.test(e.code))gas=v;if(/ArrowDown|KeyS/.test(e.code))brk=v;if(e.code==='Space')kN=v;
 if(/Arrow(Left|Right)|Key[AD]/.test(e.code)){steer=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0);rot=steer*120}}

let bullets=[],bombs=[],fxs=[],bombN=3,bombT=0,fireCd=0,fireH=0,bombReq=0,msgT=0,alt=1;
const BG=new T.BoxGeometry(.2,.2,1.4),BM=new T.MeshBasicMaterial({color:0xffe066}),SG=new T.SphereGeometry(1,14,10);
function msg(t){$('kl').textContent=t;msgT=1}
function destroy(a){if(a.dead)return;a.dead=1;a.v=0;a.m.scale.set(1.08,.28,1.08);
 a.m.traverse(o=>{if(o.material&&o.material.color){o.material=o.material.clone();o.material.color.multiplyScalar(.2)}});S.coins+=100;msg('💥 +100 🪙')}
function boom(s,d,big){const m=new T.Mesh(SG,new T.MeshBasicMaterial({color:0xff8a1a,transparent:true,opacity:.95}));place(m,s,d);m.position.y+=1.2;world.add(m);fxs.push({m,t:0,r:big?11:5});
 if(Math.abs(s-P.s)<30)shake=Math.max(shake,big?1:.6);
 if(big){for(const a of ais)if(!a.dead&&Math.abs(a.s-s)<13&&Math.abs(a.d-d)<9)destroy(a);
  for(const o of obs)if(!o.dead&&Math.abs(o.s-s)<13&&Math.abs(o.d-d)<9){o.dead=1;o.m.visible=false}}}
function combat(dt){
 if(msgT>0){msgT-=dt;if(msgT<=0)$('kl').textContent=''}
 for(let i=fxs.length-1;i>=0;i--){const f=fxs[i];f.t+=dt;const k=f.t/.7;f.m.scale.setScalar(1+k*f.r);f.m.material.opacity=Math.max(0,.95-k);f.m.material.color.setHex(k<.4?0xffd23a:0xff5a10);if(k>=1){world.remove(f.m);fxs.splice(i,1)}}
 if(st!=='run')return;
 fireCd-=dt;bombT-=dt;if(bombT<=0&&bombN<3){bombN++;bombT=6}
 if((fireH||K.KeyF)&&fireCd<=0){fireCd=.13;const m=new T.Mesh(BG,BM);world.add(m);alt=-alt;bullets.push({m,s:P.s+4,d:P.d+alt*.6,v:P.v+170,life:1.1})}
 if(bombReq){bombReq=0;if(bombN>0){bombN--;bombT=Math.max(bombT,6);const m=new T.Mesh(SG,new T.MeshPhongMaterial({color:0x222222,emissive:0x550000}));m.scale.setScalar(.5);world.add(m);bombs.push({m,s:P.s+4,d:P.d,v:P.v+40,t:0})}}
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.s+=b.v*dt;b.life-=dt;place(b.m,b.s,b.d);b.m.position.y+=.9;let hit=0;
  for(const a of ais)if(!a.dead&&Math.abs(a.s-b.s)<4&&Math.abs(a.d-b.d)<1.7){a.hp=(a.hp||100)-20;hit=1;if(a.hp<=0){boom(a.s,a.d,0);destroy(a)}break}
  if(!hit)for(const o of obs)if(!o.dead&&Math.abs(o.s-b.s)<2&&Math.abs(o.d-b.d)<1.6){o.dead=1;o.m.visible=false;hit=1;break}
  if(hit||b.life<=0){world.remove(b.m);bullets.splice(i,1)}}
 for(let i=bombs.length-1;i>=0;i--){const b=bombs[i];b.t+=dt;b.s+=b.v*dt;place(b.m,b.s,b.d);b.m.position.y+=.6+Math.sin(Math.PI*Math.min(1,b.t/1.1))*4;
  let hit=b.t>=1.1;for(const a of ais)if(!a.dead&&Math.abs(a.s-b.s)<4&&Math.abs(a.d-b.d)<2&&b.t>.15)hit=1;
  if(hit){boom(b.s,b.d,1);world.remove(b.m);bombs.splice(i,1)}}
 $('bb').textContent='BOMB '+bombN}
